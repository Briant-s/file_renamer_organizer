[project]
name = "file-renamer"
version = "0.3.2"
description = "TiFo — rename and organize files by their content, locally and offline."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "docx2txt>=0.9",
    "hdbscan>=0.8.44",
    "huggingface-hub>=1.30.0",
    "matplotlib>=3.11.2",
    "ollama>=0.6.2",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pillow>=13.0.0",
    "py7zr>=1.1.4",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "python-pptx>=1.0.2",
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "sentence-transformers>=6.0.1",
    "streamlit>=1.66.1",
    "torch>=2.4",
    "umap-learn>=0.6.0",
]

# Default: CPU wheels everywhere. Safe on AMD, NVIDIA-without-setup, and mac (MPS ships in the CPU wheel).
# NVIDIA users can opt into CUDA by pointing torch at the pytorch-cu124 index.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[project.scripts]
tifo = "tifo.app:run_app"
tifo-gui = "tifo.gui.launcher:main"
tifo-setup = "tifo.setup.embedder:run_setup"

[project.optional-dependencies]
# Streamlit GUI frontend. Install with:  uv tool install 'file-renamer[gui]'
gui = ["streamlit>=1.40"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
]
# Dev-time install of the GUI stack:  uv sync --group gui
gui = ["streamlit>=1.40"]
notebook = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tifo"]
artifacts = [
    "tifo/gui/assets/*.png",
    "tifo/gui/assets/*.svg",
    "tifo/gui/streamlit_config.toml",
]
